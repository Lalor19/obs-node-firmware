[platformio]
default_envs = feather_adalogger

[env:feather_adalogger]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_feather_adalogger
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_flags = -I test/doubles
test_build_src = yes
test_filter = embedded/*

[env:native]
platform = native
build_flags = -std=c++17 -I test/doubles
test_build_src = yes
build_src_filter = +<*> -<hardware/> -<main.cpp>
test_filter = native/*